# ================================================================
#  CI Workflow  –  GitHub Actions verification pipeline
# ================================================================

name: CI Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 06:00 UTC

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v3

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            libgomp1 \
            portaudio19-dev \
            libportaudio2 \
            espeak
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff Check (Linting)
        run: ruff check .

      - name: Mypy Check (Type safety)
        run: mypy . --ignore-missing-imports

      - name: Pytest Unit Tests
        run: pytest -v

  cold-install-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # deliberately NOT using cache: "pip" here - this job exists
          # specifically to catch what a cached install would hide
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libgomp1 portaudio19-dev libportaudio2 espeak libasound2t64
      - name: Cold install (no cache)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify mediapipe tasks API is importable
        run: python -c "from mediapipe.tasks.python.vision import PoseLandmarker"
      - name: Run full test suite on cold install
        run: pytest -v
