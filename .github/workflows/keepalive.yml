name: Keepalive Supabase & Streamlit

on:
  schedule:
    # Run every Monday and Thursday at midnight UTC
    - cron: '0 0 * * 1,4'
  workflow_dispatch: # Allow manual triggering from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit Community Cloud
        run: |
          echo "Pinging Streamlit app..."
          curl -sL "https://smart-fitness-trainer.streamlit.app/" -o /dev/null -w "%{http_code}\n"

      - name: Ping Supabase Database
        run: |
          echo "Pinging Supabase REST API..."
          # The anon key is public and safe to include here.
          # This lightweight GET request counts as database activity.
          curl -s "https://sodgsrftfydljzcozmdw.supabase.co/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvZGdzcmZ0ZnlkbGp6Y296bWR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTY5NDUsImV4cCI6MjA5OTE3Mjk0NX0.WtYMQQFUUEM59QWPqmvh0gopsbiR4D3ExOZZhaduN2U" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvZGdzcmZ0ZnlkbGp6Y296bWR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTY5NDUsImV4cCI6MjA5OTE3Mjk0NX0.WtYMQQFUUEM59QWPqmvh0gopsbiR4D3ExOZZhaduN2U" \
            -o /dev/null -w "%{http_code}\n"
