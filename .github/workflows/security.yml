# ================================================================
#  Security Workflow  –  GitHub Actions dependency security scan
# ================================================================

name: Dependency Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 06:00 UTC

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt > pip_install.log 2>&1 || exit 1
          
      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit --local > audit.log 2>&1 || exit 1

      - name: Commit and push logs on failure
        if: failure()
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add *.log
          git commit -m "chore: upload failure logs" || true
          git push || true
