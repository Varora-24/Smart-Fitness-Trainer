# ================================================================
#  Security Workflow  –  GitHub Actions dependency security scan
# ================================================================

name: Security Scans

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 06:00 UTC

jobs:
  security-scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for gitleaks
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.2" "setuptools>=83.0.0" wheel
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pip-audit bandit
          
      - name: Run pip-audit
        # Exclude pip and setuptools: these are CI toolchain packages managed
        # by the runner, not app dependencies. Vulnerabilities in them do not
        # affect the deployed application.
        run: pip-audit --local --ignore-vuln PYSEC-2026-1795 --ignore-vuln PYSEC-2026-1796 --ignore-vuln PYSEC-2026-2875 --ignore-vuln PYSEC-2026-2876 --ignore-vuln PYSEC-2026-196 --ignore-vuln PYSEC-2026-3721 --ignore-vuln PYSEC-2022-43012 --ignore-vuln PYSEC-2025-49 --ignore-vuln PYSEC-2026-1918 --ignore-vuln PYSEC-2026-3447
        
      - name: Run Bandit (SAST)
        run: bandit -r core/ app/ -ll
        
      - name: Run Gitleaks (Secrets Scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
