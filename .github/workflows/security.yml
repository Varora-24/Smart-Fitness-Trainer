# ================================================================
#  Security Workflow  –  GitHub Actions dependency security scan
# ================================================================

name: Dependency Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 06:00 UTC

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          
      - name: Run pip-audit
        run: |
          pip install pip-audit
          # PYSEC-2026-1805 (protobuf < 5.29.6, aliased CVE-2026-0994) is a DoS bug in
          # protobuf.json_format.ParseDict() triggered by attacker-controlled JSON.
          # This codebase never calls that function on user input; mediapipe==0.10.21
          # pins protobuf<5 and has no compatible patched version. Accepted risk,
          # tracked for resolution via the Tasks API migration on the Roadmap.
          # Re-evaluate this suppression whenever mediapipe is upgraded.
          pip-audit --local --ignore-vuln PYSEC-2026-1805
