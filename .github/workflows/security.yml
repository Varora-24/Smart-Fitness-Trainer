# ================================================================
#  Security Workflow  –  GitHub Actions dependency security scan
# ================================================================

name: Security Scans

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 06:00 UTC

jobs:
  security-scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for gitleaks
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.2" "setuptools>=83.0.0" wheel
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pip-audit bandit
          
      - name: Run pip-audit
        # Exclude:
        # 1. pip & setuptools: runner CI toolchain packages, not app dependencies
        # 2. pillow 12.3.0 CVEs: upstream streamlit requires pillow<13, preventing
        #    upgrade to pillow 13.0.0 until streamlit updates its dependency constraint
        run: >-
          pip-audit --local
          --ignore-vuln PYSEC-2026-1795 --ignore-vuln PYSEC-2026-1796 --ignore-vuln PYSEC-2026-2875
          --ignore-vuln PYSEC-2026-2876 --ignore-vuln PYSEC-2026-196 --ignore-vuln PYSEC-2026-3721
          --ignore-vuln PYSEC-2022-43012 --ignore-vuln PYSEC-2025-49 --ignore-vuln PYSEC-2026-1918
          --ignore-vuln PYSEC-2026-3447
          --ignore-vuln CVE-2026-112895 --ignore-vuln CVE-2026-112400 --ignore-vuln CVE-2026-112397
          --ignore-vuln CVE-2026-112896 --ignore-vuln CVE-2026-112897 --ignore-vuln CVE-2026-112395
          --ignore-vuln CVE-2026-112404 --ignore-vuln CVE-2026-112899
        
      - name: Run Bandit (SAST)
        run: bandit -r core/ app/ -ll
        
      - name: Run Gitleaks (Secrets Scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
