name: Deploy to Hugging Face Spaces

on:
  workflow_run:
    workflows: ["CI Verification"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://user:${HF_TOKEN}@huggingface.co/spaces/VanshAro/Smarttrainer
          
          # Create an orphan branch with no history to avoid pushing large files from past commits
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git checkout --orphan hf-deploy
          git add -A
          git commit -m "Automated deployment to Hugging Face Spaces"
          
          # Force push this single snapshot commit to Hugging Face's main branch
          git push hf hf-deploy:main --force > push.log 2>&1 || (
            git clone https://user:${HF_TOKEN}@huggingface.co/spaces/VanshAro/Smarttrainer hf_logs_space || true
            cp push.log hf_logs_space/ || true
            cd hf_logs_space || true
            git config --global user.name "github-actions"
            git config --global user.email "github-actions@github.com"
            git add push.log
            git commit -m "chore: upload orphan deploy failure log" || true
            git push || true
            exit 1
          )
