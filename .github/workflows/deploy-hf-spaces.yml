name: Deploy to Hugging Face Spaces

on:
  workflow_run:
    workflows: ["CI Verification"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Push landing page to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi
          
          token = os.environ.get("HF_TOKEN")
          api = HfApi(token=token)
          
          try:
              info = api.whoami()
              print(f"Successfully authenticated as: {info.get('name')}")
              print(f"Token type/permissions: {info.get('auth', {})}")
          except Exception as e:
              print(f"Authentication check failed: {e}")
          
          api.create_repo(
              repo_id="VanshAro/Smart-Fitness-Trainer",
              repo_type="space",
              space_sdk="static",
              exist_ok=True,
          )
          
          api.upload_folder(
              folder_path="hf_space",
              repo_id="VanshAro/Smart-Fitness-Trainer",
              repo_type="space",
              commit_message="chore: sync landing page from main branch"
          )
          print("Deployed to https://huggingface.co/spaces/VanshAro/Smart-Fitness-Trainer")
          EOF
