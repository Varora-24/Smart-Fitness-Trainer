name: Deploy Landing Page to Hugging Face Spaces

on:
  push:
    branches: [main]
    paths:
      - 'landing_page/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Push landing page to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi
          
          token = os.environ.get("HF_TOKEN")
          api = HfApi(token=token)
          
          try:
              info = api.whoami()
              print(f"Successfully authenticated as: {info.get('name')}")
          except Exception as e:
              print(f"Authentication check failed: {e}")
          
          # Upload only the landing_page directory
          # This intrinsically isolates the upload from the repository root,
          # completely securing .env, secrets.toml, and other sensitive files.
          api.upload_folder(
              folder_path="landing_page",
              repo_id="VanshAro/Smart-Fitness-Trainer",
              repo_type="space",
              commit_message="deploy: static landing page",
          )
          print("Deployed to https://huggingface.co/spaces/VanshAro/Smart-Fitness-Trainer")
          EOF
